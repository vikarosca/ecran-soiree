<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6ead8">
<title>Écran de soirée — Universal DJ Normandie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* =====================================================================
   ÉCRAN DE SOIRÉE v2 — Universal DJ Normandie
   Un seul fichier, trois vues :
     ?v=ecran&e=CODE    → grand écran (vidéoprojecteur / TV)
     ?v=invite&e=CODE   → page invités (QR code)
     ?v=console&e=CODE  → console DJ
   ===================================================================== */
:root,[data-theme="champagne"]{
  --bg1:#fffaf1; --bg2:#f1e2cc; --ink:#3b2f27; --muted:#8b7a6b; --card:#ffffff; --card2:#fbf5ec;
  --line:#eadbc6; --accent:#bf8840; --accent2:#e9b96c; --glow:255,190,110; --wire:92,64,40;
  --paper:#fffdf8; --shadow:rgba(90,60,30,.22); --onaccent:#fff;
}
[data-theme="bougie"]{
  --bg1:#2f1d11; --bg2:#120a05; --ink:#fbefdc; --muted:#c9ad8c; --card:#2b1c12; --card2:#352318;
  --line:#4b3423; --accent:#eab56a; --accent2:#ffd18c; --glow:255,165,80; --wire:20,12,6;
  --paper:#fff8ea; --shadow:rgba(0,0,0,.5); --onaccent:#2b1a0d;
}
[data-theme="nuit"]{
  --bg1:#18233d; --bg2:#080c16; --ink:#f4efe6; --muted:#9ba4b6; --card:#121a2b; --card2:#18223a;
  --line:#28344f; --accent:#c8a96e; --accent2:#e6cf98; --glow:220,185,120; --wire:5,8,15;
  --paper:#fffdf8; --shadow:rgba(0,0,0,.55); --onaccent:#0a0f1a;
}
[data-theme="fiesta"]{
  --bg1:#55175a; --bg2:#1d0827; --ink:#fff4ea; --muted:#e6bfe0; --card:#2e1236; --card2:#3a1844;
  --line:#5e2c66; --accent:#ff8a5c; --accent2:#ffd166; --glow:255,130,150; --wire:20,5,25;
  --paper:#fffaf3; --shadow:rgba(0,0,0,.5); --onaccent:#2a0c2e;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;color:var(--ink);font-family:'Manrope',system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  background:radial-gradient(120% 90% at 50% 0%,var(--bg1) 0%,var(--bg2) 100%) fixed;background-color:var(--bg2)}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent)}
.serif{font-family:'Cormorant Garamond',Georgia,serif}
.hand{font-family:'Caveat',cursive}
.kicker{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:700}
.demo-banner{background:#7a4a12;color:#fff2da;font-size:13px;padding:8px 14px;text-align:center;position:relative;z-index:5}
.demo-banner a{color:#ffd79a}
#toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-140%);z-index:200;background:var(--card);color:var(--ink);
  border:1px solid var(--line);box-shadow:0 12px 40px var(--shadow);padding:12px 18px;border-radius:40px;font-weight:600;
  transition:transform .5s cubic-bezier(.2,.9,.2,1),opacity .4s;max-width:92vw;text-align:center;opacity:0;pointer-events:none}
#toast.on{transform:translate(-50%,0);opacity:1}
.btn{border:1px solid var(--line);background:var(--card);padding:11px 16px;border-radius:14px;cursor:pointer;font-weight:600;transition:.15s;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
a.btn{text-decoration:none;display:inline-block}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;color:var(--onaccent);box-shadow:0 8px 22px rgba(var(--glow),.35)}
.btn.ghost{background:transparent}
.btn.danger{border-color:#d9605a;color:#d9605a;background:transparent}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--onaccent);border-color:transparent}
.btn:disabled{opacity:.5;cursor:default}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>span{font-size:13px;color:var(--muted);font-weight:600}
.field input,.field textarea,.field select,.input{background:var(--card2);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;outline:none;width:100%;color:var(--ink)}
.field input:focus,.field textarea:focus,.input:focus{border-color:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.05)}
.err-banner{position:fixed;left:12px;bottom:12px;z-index:300;background:#7d2222;color:#fff;padding:9px 13px;border-radius:10px;font-size:13px;max-width:90vw;display:none}

/* ---------- Guirlande (SVG, invités & console) ---------- */
.garland{display:block;width:100%;height:70px;overflow:visible}
.garland .bulb{animation:tw 2.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.45}}

/* ---------- Accueil (choix de vue) ---------- */
.home{max-width:660px;margin:0 auto;padding:10px 16px 50px}
.home h1{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:46px;margin:6px 0}
.home p{color:var(--muted);line-height:1.6}
.home .views{display:grid;gap:12px;margin-top:20px}
.home .views a{text-decoration:none;color:var(--ink);display:block}
.home .views b{font-size:18px}

/* =========================== GRAND ÉCRAN =========================== */
.screen{position:fixed;inset:0;overflow:hidden;cursor:none}
.screen.cur{cursor:default}
#amb{position:absolute;inset:0;width:100%;height:100%}
#stage{position:absolute;inset:0}
.scene{position:absolute;inset:0;opacity:0;transition:opacity 1.1s ease}
.scene.in{opacity:1}
.scene.out{opacity:0}
.center{display:flex;align-items:center;justify-content:center}

/* accueil */
.welcome{position:absolute;inset:0;display:grid;grid-template-columns:1.35fr 1fr;align-items:center;padding:6vh 6vw;gap:4vw}
.welcome.noqr{grid-template-columns:1fr;text-align:center}
.welcome .sub{font-size:1.5vw;letter-spacing:.35em;text-transform:uppercase;color:var(--accent);font-weight:700}
.welcome .names{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:8.6vw;line-height:.98;margin:2.4vh 0;color:var(--ink)}
.welcome .names .amp{font-family:'Caveat',cursive;color:var(--accent);font-size:.8em;padding:0 .12em}
.welcome .date{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:2.8vw;color:var(--muted)}
.welcome .cd{margin-top:4vh}
.welcome .cd .l{font-size:1.15vw;letter-spacing:.25em;text-transform:uppercase;color:var(--muted);font-weight:700}
.welcome .cd .v{font-family:'Cormorant Garamond',serif;font-size:6vw;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.05}
.bigqr{justify-self:center;text-align:center;background:var(--paper);color:#3b2f27;padding:2.4vw 2.4vw 1.6vw;border-radius:2vw;box-shadow:0 3vh 8vh var(--shadow);transform:rotate(2deg);animation:float 6s ease-in-out infinite}
.bigqr .q{line-height:0;display:inline-block}
.bigqr .q img,.bigqr .q canvas{width:20vw!important;height:20vw!important;max-width:34vh!important;max-height:34vh!important}
.bigqr .t{font-family:'Caveat',cursive;font-size:2.6vw;line-height:1.1;margin-top:1.2vh}
.bigqr .t small{display:block;font-family:'Manrope',sans-serif;font-size:1vw;letter-spacing:.12em;text-transform:uppercase;color:#8b7a6b;margin-top:.6vh}
@keyframes float{0%,100%{transform:rotate(2deg) translateY(0)}50%{transform:rotate(1deg) translateY(-1.2vh)}}

/* polaroid */
.pola{position:absolute;background:var(--paper);padding:1.1vw 1.1vw 0;box-shadow:0 2.4vh 6vh var(--shadow),0 .3vh .8vh rgba(0,0,0,.12);border-radius:.3vw}
.pola::before{content:"";position:absolute;top:-1.4vh;left:50%;width:7vw;height:3.2vh;transform:translateX(-50%) rotate(-3deg);
  background:rgba(var(--glow),.55);box-shadow:0 1px 2px rgba(0,0,0,.08);backdrop-filter:blur(2px)}
.pola .ph{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:#e9e1d6}
.pola .cap{font-family:'Caveat',cursive;color:#3b2f27;text-align:center;padding:.8vh .4vw 1.4vh;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pola .cap small{display:block;font-family:'Manrope',sans-serif;font-size:.62em;letter-spacing:.14em;text-transform:uppercase;color:#9b8a7a;margin-top:.3vh}
.pola .likes{position:absolute;right:1vw;bottom:1.1vh;font-family:'Manrope',sans-serif;font-weight:700;color:#d24c5c;font-size:1vw}
.drop{animation:drop 1.1s cubic-bezier(.2,1.25,.3,1) both}
@keyframes drop{from{opacity:0;transform:translate(-50%,-50%) translateY(-30vh) rotate(calc(var(--r) * 3)) scale(1.15)}to{opacity:1;transform:translate(-50%,-50%) rotate(var(--r))}}
.mur .pola{transform:translate(-50%,-50%) rotate(var(--r))}
.mur .title{position:absolute;left:0;right:0;top:3vh;text-align:center;font-family:'Caveat',cursive;font-size:3.4vw;color:var(--accent)}

/* vedette */
.ved-bg{position:absolute;inset:-6%;background-size:cover;background-position:center;filter:blur(46px) saturate(1.2);opacity:.55;transform:scale(1.08)}
.ved{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.ved figure{margin:0;position:relative;background:var(--paper);padding:1.4vh 1.4vh 0;border-radius:.5vh;box-shadow:0 4vh 10vh var(--shadow);transform:rotate(var(--r));animation:vin 1.3s cubic-bezier(.2,1.1,.3,1) both}
.ved img{display:block;max-height:76vh;max-width:84vw;border-radius:.2vh}
.ved figcaption{font-family:'Caveat',cursive;color:#3b2f27;text-align:center;font-size:4.4vh;padding:1vh 2vh 1.6vh;line-height:1.1}
.ved figcaption small{font-family:'Manrope',sans-serif;font-size:1.6vh;letter-spacing:.16em;text-transform:uppercase;color:#9b8a7a;margin-left:1.2vh}
@keyframes vin{from{opacity:0;transform:rotate(calc(var(--r) - 6deg)) scale(.82) translateY(6vh)}to{opacity:1;transform:rotate(var(--r)) scale(1)}}
.ribbon{position:absolute;top:2.2vh;right:-1.2vh;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--onaccent);font-weight:700;font-size:1.8vh;letter-spacing:.14em;text-transform:uppercase;padding:.8vh 2vh;border-radius:.6vh;box-shadow:0 1vh 2vh rgba(0,0,0,.2)}
.defi-tag{position:absolute;top:2.2vh;left:-1.2vh;background:var(--paper);color:#3b2f27;font-family:'Caveat',cursive;font-size:3.2vh;padding:.4vh 2vh;border-radius:.6vh;box-shadow:0 1vh 2vh rgba(0,0,0,.2);transform:rotate(-3deg);max-width:40vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* mosaïque */
.mosa{position:absolute;inset:0;display:grid;gap:.5vw;padding:.5vw}
.mosa div{background:#000 center/cover no-repeat;border-radius:.6vw;opacity:0;animation:tile .9s ease forwards}
@keyframes tile{from{opacity:0;transform:scale(.85) rotateY(70deg)}to{opacity:1;transform:none}}
.mosa-card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.25);padding:3.5vh 4.5vw;border-radius:3vh;text-align:center;box-shadow:0 4vh 10vh var(--shadow)}
.mosa-card .n{font-family:'Cormorant Garamond',serif;font-size:6vw;line-height:1}
.mosa-card .n .amp{font-family:'Caveat',cursive;color:var(--accent)}
.mosa-card .s{font-family:'Caveat',cursive;font-size:2.6vw;color:var(--accent);margin-top:1vh}

/* mot doux */
.mot{position:absolute;left:50%;top:50%;width:min(70vw,140vh);transform:translate(-50%,-50%) rotate(var(--r));background:var(--paper);color:#3b2f27;border-radius:1vh;
  padding:7vh 6vw 6vh;box-shadow:0 4vh 10vh var(--shadow);animation:motin 1.2s cubic-bezier(.2,1.1,.3,1) both;
  background-image:repeating-linear-gradient(transparent 0 6.4vh,rgba(191,136,64,.13) 6.4vh calc(6.4vh + 2px))}
@keyframes motin{from{opacity:0;transform:translate(-50%,-44%) rotate(calc(var(--r) + 4deg)) scale(.9)}to{opacity:1;transform:translate(-50%,-50%) rotate(var(--r))}}
.mot .k{position:absolute;top:2.4vh;left:6vw;font-size:1.6vh;letter-spacing:.24em;text-transform:uppercase;color:#bf8840;font-weight:700}
.mot .t{font-family:'Caveat',cursive;line-height:1.12}
.mot .t.s{font-size:9vh}.mot .t.m{font-size:6.6vh}.mot .t.l{font-size:4.8vh}
.mot .a{margin-top:3vh;font-family:'Caveat',cursive;font-size:5vh;color:#bf8840;text-align:right}
.mot .seal{position:absolute;right:-2.6vh;top:-2.6vh;width:9vh;height:9vh;border-radius:50%;background:radial-gradient(circle at 35% 35%,#e06a6a,#9c2733);display:flex;align-items:center;justify-content:center;color:#ffe3dc;font-size:4vh;box-shadow:0 1vh 2vh rgba(0,0,0,.3)}

/* défi */
.defi{position:absolute;inset:0;display:grid;grid-template-columns:1.4fr 1fr;align-items:center;padding:6vh 6vw;gap:4vw}
.defi .k{font-size:1.5vw;letter-spacing:.3em;text-transform:uppercase;color:var(--accent);font-weight:700}
.defi .t{font-family:'Caveat',cursive;font-size:6.4vw;line-height:1.02;margin:2vh 0}
.defi .s{font-size:1.6vw;color:var(--muted);line-height:1.5}

/* quiz */
.quiz{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(82vw,1500px)}
.quiz h2{font-family:'Cormorant Garamond',serif;font-weight:500;text-align:center;font-size:5vw;margin:0 0 4vh}
.quiz h2 span{font-family:'Caveat',cursive;color:var(--accent)}
.qrow{display:grid;grid-template-columns:5vw 1fr 8vw;align-items:center;gap:1.5vw;margin:1.3vh 0;font-size:2.4vw}
.qrow .rk{font-family:'Cormorant Garamond',serif;color:var(--muted);text-align:right}
.qrow.r1 .rk{color:var(--accent)}
.qbar{position:relative;height:5.6vh;background:rgba(var(--glow),.12);border-radius:3vh;overflow:hidden}
.qbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,rgba(var(--glow),.4),var(--accent));border-radius:3vh;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.qbar span{position:absolute;left:1.4vw;top:50%;transform:translateY(-50%);font-weight:700;color:var(--ink)}
.qrow .sc{font-family:'Cormorant Garamond',serif;font-size:3.2vw;font-variant-numeric:tabular-nums}

.noir{position:absolute;inset:0;background:#000;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4vh;font-family:'Caveat',cursive;color:#3a3028;font-size:2vw}
.empty-scene .hint{font-family:'Caveat',cursive;font-size:3vw;color:var(--muted)}

/* overlays */
.qrbox{position:absolute;right:2vw;bottom:2.6vh;display:flex;align-items:center;gap:1.1vw;background:var(--paper);color:#3b2f27;border-radius:1.6vw;padding:1vw 1.4vw 1vw 1vw;
  box-shadow:0 2vh 5vh var(--shadow);transition:opacity .6s,transform .6s;transform:rotate(-1.5deg);z-index:20}
.qrbox .q{line-height:0}
.qrbox .q img,.qrbox .q canvas{width:10.5vh!important;height:10.5vh!important}
.qrbox .t{font-family:'Caveat',cursive;font-size:3.3vh;line-height:1}
.qrbox .t small{display:block;font-family:'Manrope',sans-serif;font-size:1.25vh;letter-spacing:.14em;text-transform:uppercase;color:#9b8a7a;margin-top:.7vh}
.qrbox.hide{opacity:0;transform:translateY(4vh)}
.stats{position:absolute;left:2vw;top:2.4vh;display:flex;gap:.8vw;z-index:20;transition:opacity .6s}
.stats span{background:color-mix(in srgb,var(--card) 75%,transparent);backdrop-filter:blur(8px);border:1px solid rgba(var(--glow),.25);padding:.7vh 1.2vw;border-radius:3vh;font-weight:700;font-size:1.8vh;color:var(--ink)}
.stats.hide{opacity:0}
.flyer{position:absolute;bottom:-8vh;font-size:5.5vh;z-index:30;pointer-events:none;animation:fly var(--d) ease-out forwards;will-change:transform,opacity}
@keyframes fly{0%{transform:translate(0,0) scale(.6);opacity:0}10%{opacity:1}100%{transform:translate(var(--x),-105vh) scale(1.25) rotate(var(--rot));opacity:0}}
.annonce{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;text-align:center;
  background:radial-gradient(circle at 50% 50%,rgba(var(--glow),.5),transparent 70%),radial-gradient(120% 90% at 50% 0%,var(--bg1),var(--bg2));
  opacity:0;pointer-events:none;transition:opacity .8s}
.annonce.on{opacity:1}
.annonce .k{font-size:2vw;letter-spacing:.4em;text-transform:uppercase;color:var(--accent);font-weight:700}
.annonce .t{font-family:'Caveat',cursive;font-size:10vw;line-height:1;margin-top:2vh;padding:0 5vw;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.toastbig{position:absolute;left:50%;top:3vh;transform:translate(-50%,-160%);z-index:40;background:var(--paper);color:#3b2f27;padding:1.4vh 2.4vw;border-radius:5vh;
  font-weight:700;font-size:2.2vh;box-shadow:0 2vh 5vh var(--shadow);transition:transform .7s cubic-bezier(.2,1.2,.3,1),opacity .5s;opacity:0}
.toastbig.on{transform:translate(-50%,0);opacity:1}
.start{position:absolute;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh;background:radial-gradient(circle,rgba(0,0,0,.25),rgba(0,0,0,.6));cursor:default;text-align:center;color:#fff}
.start button{font-size:3.2vh;padding:2.4vh 5vh;border-radius:6vh}
.start p{max-width:60vw;font-size:2vh;line-height:1.6;opacity:.9}

/* =========================== INVITÉS =========================== */
.guest{max-width:540px;margin:0 auto;padding:0 16px 150px;position:relative}
.g-hero{text-align:center;padding:4px 0 10px}
.g-hero .names{font-family:'Cormorant Garamond',serif;font-size:44px;line-height:1.05;margin:6px 0 2px}
.g-hero .names .amp{font-family:'Caveat',cursive;color:var(--accent);font-size:.85em}
.g-hero .date{color:var(--muted);font-family:'Cormorant Garamond',serif;font-style:italic;font-size:19px}
.hello{font-family:'Caveat',cursive;font-size:26px;color:var(--accent);text-align:center;margin:6px 0 14px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.act{border:0;border-radius:24px;padding:22px 14px;text-align:left;cursor:pointer;background:var(--card);box-shadow:0 10px 26px rgba(0,0,0,.07);border:1px solid var(--line);position:relative;overflow:hidden;color:var(--ink)}
.act .e{font-size:34px;display:block;margin-bottom:10px}
.act b{display:block;font-size:17px}
.act small{color:var(--muted);font-size:13px}
.act.main{grid-column:1/-1;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--onaccent);border:0;padding:26px 20px}
.act.main small{color:inherit;opacity:.85}
.act.main::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.18)}
.back{background:none;border:0;color:var(--muted);font-weight:600;padding:8px 0;cursor:pointer;margin-bottom:6px}
.pick{display:block;border:2px dashed var(--line);border-radius:22px;padding:34px 16px;text-align:center;cursor:pointer;color:var(--muted);background:var(--card)}
.pick b{display:block;color:var(--ink);font-size:18px;margin:6px 0 4px}
.pick .e{font-size:40px}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px}
.defi-chip{display:inline-block;background:rgba(var(--glow),.2);color:var(--ink);border-radius:20px;padding:6px 12px;font-weight:600;font-size:14px;margin-bottom:12px}
.defis{display:grid;gap:10px}
.defis button{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:16px;cursor:pointer;font-family:'Caveat',cursive;font-size:26px;color:var(--ink);display:flex;justify-content:space-between;align-items:center}
.defis button span{font-family:'Manrope',sans-serif;font-size:13px;color:var(--accent);font-weight:700}
.success{text-align:center;padding:30px 10px}
.success .e{font-size:64px;animation:pop .8s cubic-bezier(.2,1.6,.4,1)}

<body>
<div id="app"></div>
<div id="toast"></div>
<div class="err-banner" id="err"></div>

<script>
/* =====================================================================
   1. CONFIGURATION
   ===================================================================== */
const CONFIG = {
  firebase: {
    projectId: 'ecran-soiree-udn',
    apiKey: 'AIzaSyBPhKfh2FRLKP2VgKm-xQJyakiztx4mj8Y'   // clé Web publique (normal qu'elle soit visible)
  },
  pinConsole: '1234',     // code d'accès console ('' = aucun)
  pollMs: 3000,           // synchro écran / console
  brand: 'Universal DJ Normandie'
};
// ?demo=1 force le mode démo local (tests)
const FORCE_DEMO = new URLSearchParams(location.search).get('demo') === '1';

/* =====================================================================
   2. OUTILS
   ===================================================================== */
const params = new URLSearchParams(location.search);
const VIEW  = params.get('v') || 'home';
const EVENT = (params.get('e') || 'demo').toLowerCase().replace(/[^a-z0-9_-]/g, '').slice(0, 40) || 'demo';
const DEMO  = FORCE_DEMO || !CONFIG.firebase.projectId;
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const rnd = (a, b) => a + Math.random() * (b - a);
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const viewUrl = v => location.origin + location.pathname + '?v=' + v + '&e=' + encodeURIComponent(EVENT) + (FORCE_DEMO ? '&demo=1' : '');
const REACTS = [['coeur', '❤️'], ['verre', '🥂'], ['rire', '😂'], ['feu', '🔥'], ['bravo', '👏']];
const THEMES = {
  champagne: { name: 'Champagne', sw: 'linear-gradient(135deg,#fffaf1,#f1e2cc)', dot: '#bf8840' },
  bougie:    { name: 'Bougie',    sw: 'linear-gradient(135deg,#3a2414,#120a05)', dot: '#eab56a' },
  nuit:      { name: 'Nuit étoilée', sw: 'linear-gradient(135deg,#18233d,#080c16)', dot: '#c8a96e' },
  fiesta:    { name: 'Fiesta',    sw: 'linear-gradient(135deg,#6a1d6e,#1d0827)', dot: '#ff8a5c' }
};

function showError(msg) {
  const el = $('#err'); el.textContent = msg; el.style.display = 'block';
  clearTimeout(showError.t); showError.t = setTimeout(() => el.style.display = 'none', 7000);
}
function toast(msg, ms = 2800) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), ms);
}
function fmtDate(d) {
  if (!d) return '';
  const x = new Date(d + 'T12:00:00');
  return isNaN(x) ? d : x.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
}
function namesHtml(n) {
  const v = (n || '').trim();
  if (!v) return 'Bienvenue';
  return esc(v).replace(/\s*(&amp;|\+|\bet\b)\s*/i, ' <span class="amp">&amp;</span> ');
}
function makeQR(el, text, size) {
  el.innerHTML = '';
  if (window.QRCode) new QRCode(el, { text, width: size, height: size, colorDark: '#2b2118', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
  else el.innerHTML = '<span style="color:#000;font-size:12px;line-height:1.3">QR indisponible<br>(pas d\'internet)</span>';
}
function garlandSVG() {
  // guirlande guinguette décorative, calculée à la largeur de l'écran
  const W = Math.max(320, Math.min(2600, innerWidth || 800)), H = 64, n = Math.max(2, Math.round(W / 430)), sag = 24, top = 4, per = 7;
  const cols = ['var(--accent2)', 'var(--accent)', '#ffd8a0'];
  let paths = '', bulbs = '', k = 0;
  for (let sw = 0; sw < n; sw++) {
    const x0 = sw * W / n, x1 = (sw + 1) * W / n, xm = (x0 + x1) / 2, yc = top + 2 * sag;
    paths += `M${x0},${top} Q${xm},${yc} ${x1},${top} `;
    for (let i = 1; i < per; i++) {
      const t = i / per, x = (1 - t) ** 2 * x0 + 2 * (1 - t) * t * xm + t * t * x1, y = (1 - t) ** 2 * top + 2 * (1 - t) * t * yc + t * t * top;
      bulbs += `<g class="bulb" style="animation-delay:${((k++) * 0.37 % 2.4).toFixed(2)}s"><line x1="${x}" y1="${y}" x2="${x}" y2="${y + 5}" stroke="var(--muted)" stroke-opacity=".55" stroke-width="1.4"/><circle cx="${x}" cy="${y + 11}" r="12" fill="rgba(var(--glow),.25)"/><circle cx="${x}" cy="${y + 11}" r="4.6" fill="${cols[k % 3]}"/></g>`;
    }
  }
  return `<svg class="garland" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMin meet" style="height:${H}px" aria-hidden="true"><path d="${paths}" fill="none" stroke="var(--muted)" stroke-opacity=".55" stroke-width="1.5"/>${bulbs}</svg>`;
}

/* Compression photo : image (≈ 1600 px) + vignette (≈ 360 px) */
async function compressImage(file) {
  let bmp;
  try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch (e) { bmp = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); }); }
  const w0 = bmp.width, h0 = bmp.height;
  const draw = (maxSide, q) => {
    const sc = Math.min(1, maxSide / Math.max(w0, h0)), c = document.createElement('canvas');
    c.width = Math.round(w0 * sc); c.height = Math.round(h0 * sc);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', q);
  };
  let side = DEMO ? 900 : 1600, q = DEMO ? 0.68 : 0.82, data = '';
  for (let i = 0; i < 6; i++) { data = draw(side, q); if (data.length < (DEMO ? 220000 : 850000)) break; side *= 0.82; q = Math.max(0.5, q - 0.06); }
  const thumb = draw(DEMO ? 260 : 360, 0.7);
  return { data, thumb, ratio: w0 / h0 };
}

/* =====================================================================
   3. STOCKAGE — Firestore REST ou démo locale (même interface)
   ecran/{EVENT}/ settings/main · photos · photoData · messages · teams · meta/rev · meta/reactions
   ===================================================================== */
function FirestoreStore(projectId, apiKey) {
  const API = 'https://firestore.googleapis.com/v1/';
  const DB = `projects/${projectId}/databases/(default)/documents`;
  const ROOT = `${DB}/ecran/${EVENT}`;
  const enc = v => v === null || v === undefined ? { nullValue: null }
    : typeof v === 'boolean' ? { booleanValue: v }
    : typeof v === 'number' ? (Number.isInteger(v) ? { integerValue: String(v) } : { doubleValue: v })
    : { stringValue: String(v) };
  const dec = f => 'stringValue' in f ? f.stringValue : 'integerValue' in f ? Number(f.integerValue)
    : 'doubleValue' in f ? f.doubleValue : 'booleanValue' in f ? f.booleanValue
    : 'timestampValue' in f ? Date.parse(f.timestampValue) : null;
  const fields = o => Object.fromEntries(Object.entries(o).map(([k, v]) => [k, enc(v)]));
  const fromDoc = d => { const o = { id: d.name.split('/').pop() }; for (const [k, v] of Object.entries(d.fields || {})) o[k] = dec(v); return o; };
  async function req(method, path, body) {
    const r = await fetch(API + path + (path.includes('?') ? '&' : '?') + 'key=' + encodeURIComponent(apiKey), {
      method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined
    });
    if (r.status === 404) return null;
    if (!r.ok) throw new Error('Firestore ' + r.status + ' : ' + (await r.text()).slice(0, 160));
    const t = await r.text(); return t ? JSON.parse(t) : null;
  }
  const revWrite = coll => ({ update: { name: `${ROOT}/meta/rev`, fields: {} }, updateMask: { fieldPaths: [] },
    updateTransforms: [{ fieldPath: coll, increment: { integerValue: '1' } }] });
  async function query(coll, opts) {
    const q = { from: [{ collectionId: coll }], orderBy: [{ field: { fieldPath: 'mt' }, direction: opts.desc ? 'DESCENDING' : 'ASCENDING' }], limit: opts.limit || 300 };
    if (opts.since > 0) q.where = { fieldFilter: { field: { fieldPath: 'mt' }, op: 'GREATER_THAN', value: { timestampValue: new Date(opts.since).toISOString() } } };
    const res = await req('POST', `${ROOT}:runQuery`, { structuredQuery: q });
    return (res || []).filter(x => x.document).map(x => fromDoc(x.document));
  }
  return {
    async write(coll, id, data, merge = false, bump = true) {
      const w = { update: { name: `${ROOT}/${coll}/${id}`, fields: fields(data) }, updateTransforms: [{ fieldPath: 'mt', setToServerValue: 'REQUEST_TIME' }] };
      if (merge) w.updateMask = { fieldPaths: Object.keys(data) };
      const writes = [w]; if (bump) writes.push(revWrite(coll));
      await req('POST', `${DB}:commit`, { writes });
    },
    async increment(coll, id, field, n) {
      await req('POST', `${DB}:commit`, { writes: [{
        update: { name: `${ROOT}/${coll}/${id}`, fields: {} }, updateMask: { fieldPaths: [] },
        updateTransforms: [{ fieldPath: field, increment: { integerValue: String(n) } }, { fieldPath: 'mt', setToServerValue: 'REQUEST_TIME' }]
      }, revWrite(coll)] });
    },
    async get(coll, id) { const d = await req('GET', `${ROOT}/${coll}/${id}`); return d ? fromDoc(d) : null; },
    async remove(coll, id) { await req('DELETE', `${ROOT}/${coll}/${id}`); },
    async getRev() { const d = await req('GET', `${ROOT}/meta/rev`); return d ? fromDoc(d) : {}; },
    async delta(coll, since) {
      const out = []; let s = since;
      for (let p = 0; p < 20; p++) {
        const docs = await query(coll, { since: s, limit: 300 });
        out.push(...docs); if (docs.length < 300) break; s = docs[docs.length - 1].mt;
      }
      return out;
    },
    recent(coll, n) { return query(coll, { desc: true, limit: n }); }
  };
}

function DemoStore() {
  const MEM = {};
  const key = c => `ecran:${EVENT}:${c}`;
  const read = c => { try { return JSON.parse(localStorage.getItem(key(c)) || '{}'); } catch (e) { return MEM[c] || {}; } };
  const save = (c, o) => {
    try { localStorage.setItem(key(c), JSON.stringify(o)); }
    catch (e) { if (/quota/i.test(e.name + e.message)) throw new Error('Mode démo : stockage du navigateur plein (videz la démo depuis la console).'); MEM[c] = o; }
  };
  let last = 0; const now = () => (last = Math.max(Date.now(), last + 1));
  const bump = c => { const r = read('_rev'); r[c] = (r[c] || 0) + 1; save('_rev', r); };
  return {
    async write(c, id, data, merge = false, b = true) { const o = read(c); o[id] = Object.assign(merge ? (o[id] || {}) : {}, data, { mt: now() }); save(c, o); if (b) bump(c); },
    async increment(c, id, f, n) { const o = read(c); const d = o[id] || {}; d[f] = (d[f] || 0) + n; d.mt = now(); o[id] = d; save(c, o); bump(c); },
    async get(c, id) { const d = read(c)[id]; return d ? { ...d, id } : null; },
    async remove(c, id) { const o = read(c); delete o[id]; save(c, o); },
    async getRev() { return read('_rev'); },
    async delta(c, since) { return Object.entries(read(c)).filter(([, d]) => (d.mt || 0) > since).map(([id, d]) => ({ ...d, id })); },
    async recent(c, n) { return Object.entries(read(c)).map(([id, d]) => ({ ...d, id })).sort((a, b) => b.mt - a.mt).slice(0, n); },
    wipe() { ['settings', 'photos', 'photoData', 'messages', 'teams', 'meta', '_rev'].forEach(c => { try { localStorage.removeItem(key(c)); } catch (e) {} }); }
  };
}
const store = DEMO ? DemoStore() : FirestoreStore(CONFIG.firebase.projectId, CONFIG.firebase.apiKey);

/* ---------- Synchronisation incrémentale ---------- */
const cache = { settings: {}, photos: {}, messages: {}, teams: {}, reactions: {} };
const lastRev = {}, lastMt = {};
async function syncOnce(colls) {
  const rev = await store.getRev();
  const changed = [];
  for (const c of colls) {
    if (c === 'reactions') {
      const r = rev.meta || 0;
      if (lastRev.meta === r) continue;
      cache.reactions = (await store.get('meta', 'reactions')) || {};
      lastRev.meta = r; changed.push('reactions'); continue;
    }
    const r = rev[c] || 0;
    if (lastRev[c] === r) continue;
    const docs = await store.delta(c, lastMt[c] ? lastMt[c] - 15000 : 0);
    for (const d of docs) { cache[c][d.id] = d; if ((d.mt || 0) > (lastMt[c] || 0)) lastMt[c] = d.mt; }
    lastRev[c] = r; changed.push(c);
  }
  return changed;
}
function startSync(colls, onChange, ms = CONFIG.pollMs) {
  let fails = 0, busy = false;
  const run = async () => {
    if (busy) return; busy = true;
    try { const ch = await syncOnce(colls); fails = 0; if (ch.length) onChange(ch); }
    catch (e) { fails++; if (fails === 1 || fails % 10 === 0) showError('Synchro : ' + e.message); }
    busy = false;
  };
  (async function loop() { await run(); setTimeout(loop, ms); })();
  if (DEMO) window.addEventListener('storage', run);
  return run;
}
const DEFAULTS = {
  names: '', subtitle: 'Bienvenue à notre mariage', date: '', countdownTo: '', countdownLabel: 'Ouverture du bal',
  mode: 'auto', moderation: false, slideSec: 8, showQr: true, showStats: true, reactions: true, quizAuto: false,
  theme: 'champagne', accent: '', pinned: '', pinnedAt: 0, announce: '', announceAt: 0, announceSec: 20,
  challenges: "Un selfie avec les mariés\nLa plus belle grimace de la table\nUn toast à l'amour 🥂\nLe pas de danse le plus fou\nVotre table au complet"
};
const S = () => Object.assign({}, DEFAULTS, cache.settings.main || {});
const live = (coll, status = 'ok') => Object.values(cache[coll]).filter(d => d.status === status).sort((a, b) => (a.ts || 0) - (b.ts || 0));
const challenges = () => (S().challenges || '').split('\n').map(x => x.trim()).filter(Boolean).slice(0, 12);
function applyTheme() {
  const s = S();
  document.documentElement.dataset.theme = THEMES[s.theme] ? s.theme : 'champagne';
  if (s.accent) { document.documentElement.style.setProperty('--accent', s.accent); }
  else document.documentElement.style.removeProperty('--accent');
  const mc = $('meta[name="theme-color"]'); if (mc) mc.content = getComputedStyle(document.documentElement).getPropertyValue('--bg1').trim();
}
const photoCache = new Map();
async function photoSrc(id) {
  if (photoCache.has(id)) return photoCache.get(id);
  const p = store.get('photoData', id).then(d => d && d.data || null).catch(() => null);
  photoCache.set(id, p);
  const v = await p; if (!v) photoCache.delete(id);
  return v;
}
const saveSettings = patch => store.write('settings', 'main', patch, true);

/* =====================================================================
   4. ACCUEIL (choix de la vue)
   ===================================================================== */
function viewHome() {
  applyTheme();
  $('#app').innerHTML = `
  ${DEMO ? '<div class="demo-banner">Mode démo : données gardées dans ce navigateur uniquement.</div>' : ''}
  ${garlandSVG()}
  <div class="home">
    <div class="kicker">${esc(CONFIG.brand)}</div>
    <h1>Écran de soirée</h1>
    <p>Un code par événement (ex. <b>mariage-julie-thomas</b>). Les trois vues partagent ce code.</p>
    <div class="field"><span>Code de l'événement</span><input id="ev" value="${esc(EVENT)}"></div>
    <div class="views">
      <a class="card" id="l-console"><b>🎛️ Console DJ →</b><br><small>Tout se pilote d'ici : écran, annonces, photos, quiz, réglages.</small></a>
      <a class="card" id="l-ecran"><b>📺 Grand écran →</b><br><small>À ouvrir sur l'ordinateur relié au vidéoprojecteur.</small></a>
      <a class="card" id="l-invite"><b>📱 Page invités →</b><br><small>Ce que voient les invités après avoir scanné le QR code.</small></a>

function Ambiance(canvas) {
  const ctx = canvas.getContext('2d');
  let w, h, dpr, bokeh = [], bulbs = [], swags = [], glow = '255,190,110', wire = '92,64,40', raf, last = 0;
  function readVars() {
    const cs = getComputedStyle(document.documentElement);
    glow = cs.getPropertyValue('--glow').trim() || glow; wire = cs.getPropertyValue('--wire').trim() || wire;
  }
  function resize() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    w = canvas.clientWidth; h = canvas.clientHeight; canvas.width = w * dpr; canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    bokeh = Array.from({ length: 26 }, () => ({ x: rnd(0, w), y: rnd(0, h), r: rnd(h * .04, h * .16), vx: rnd(-.12, .12), vy: rnd(-.18, -.04), a: rnd(.05, .16), p: rnd(0, 6.28) }));
    // guirlandes guinguette : 3 festons en haut de l'écran
    swags = []; bulbs = [];
    const n = 3, sag = h * .085, top = h * .015;
    for (let s = 0; s < n; s++) {
      const x0 = s * w / n, x1 = (s + 1) * w / n;
      swags.push([x0, x1]);
      const count = 9;
      for (let i = 1; i < count; i++) {
        const t = i / count, x = x0 + (x1 - x0) * t, y = top + 4 * sag * t * (1 - t);
        bulbs.push({ x, y: y + h * .012, p: rnd(0, 6.28), sp: rnd(.6, 1.6), c: ['255,214,150', '255,186,110', '255,232,190'][i % 3] });
      }
    }
  }
  function frame(t) {
    raf = requestAnimationFrame(frame);
    if (t - last < 33) return; last = t;
    ctx.clearRect(0, 0, w, h);
    for (const b of bokeh) {
      b.x += b.vx; b.y += b.vy; if (b.y < -b.r) { b.y = h + b.r; b.x = rnd(0, w); } if (b.x < -b.r) b.x = w + b.r; if (b.x > w + b.r) b.x = -b.r;
      const a = b.a * (.75 + .25 * Math.sin(t / 1400 + b.p));
      const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
      g.addColorStop(0, `rgba(${glow},${a})`); g.addColorStop(.6, `rgba(${glow},${a * .5})`); g.addColorStop(1, `rgba(${glow},0)`);
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.283); ctx.fill();
    }
    ctx.strokeStyle = `rgba(${wire},.5)`; ctx.lineWidth = 1.6;
    const sag = h * .085, top = h * .015;
    for (const [x0, x1] of swags) { ctx.beginPath(); ctx.moveTo(x0, top); ctx.quadraticCurveTo((x0 + x1) / 2, top + 2 * sag, x1, top); ctx.stroke(); }
    for (const b of bulbs) {
      const k = .7 + .3 * Math.sin(t / 1000 * b.sp + b.p), R = h * .035;
      const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, R);
      g.addColorStop(0, `rgba(${b.c},${.55 * k})`); g.addColorStop(1, `rgba(${b.c},0)`);
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(b.x, b.y, R, 0, 6.283); ctx.fill();
      ctx.fillStyle = `rgba(${b.c},${.75 + .25 * k})`; ctx.beginPath(); ctx.arc(b.x, b.y, h * .0075, 0, 6.283); ctx.fill();
    }
  }
  readVars(); resize(); raf = requestAnimationFrame(frame);
  window.addEventListener('resize', resize);
  return { refresh() { readVars(); } };
}

    document.body.appendChild(fl); setTimeout(() => fl.remove(), 1500);

  function confetti() {
    const cols = ['#e9b96c', '#bf8840', '#e06a6a', '#ffd8a0', '#8fc7a8', '#f4a3b4'];

        case 'delp': return delPhoto(id);
        case 'delm': return act(() => store.write('messages', id, { status: 'del' }, true));
        case 'pinp': return pinNow('photo', id);
        case 'pinm': return pinNow('message', id);
        case 'dl': { const src = await photoSrc(id); if (src) { const a = document.createElement('a'); a.href = src; a.download = `${EVENT}-${id}.jpg`; a.click(); } }
      }
    });
    if ($('#zip')) $('#zip').onclick = async () => {
      if (!window.JSZip) return showError('Module ZIP indisponible (connexion internet ?)');
      const btn = $('#zip'); btn.disabled = true; const zip = new JSZip(), list = live('photos'), mots = live('messages');
      for (let i = 0; i < list.length; i++) {
        btn.textContent = `Préparation ${i + 1} / ${list.length}…`;
        const src = await photoSrc(list[i].id); if (!src) continue;
        const nm = `${String(i + 1).padStart(3, '0')}${list[i].author ? '-' + list[i].author.replace(/[^\wÀ-ÿ-]+/g, '_') : ''}.jpg`;
        zip.file(nm, src.split(',')[1], { base64: true });
      }
      if (mots.length) zip.file('mots-doux.txt', mots.map(m => `« ${m.text} »\n— ${m.author || 'Anonyme'}\n`).join('\n'));
      const blob = await zip.generateAsync({ type: 'blob' }), a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = `souvenirs-${EVENT}.zip`; a.click();
      btn.textContent = '⬇ Tout télécharger (ZIP)'; btn.disabled = false;
    };
  }
  function tabDefis() {
    $('#body').innerHTML = `<div class="card"><h3 class="sec">🎯 Défis photo</h3>
      <p class="sub">Un défi par ligne (12 maximum). Les invités les voient sur leur téléphone, et le grand écran les lance régulièrement.</p>
      <textarea class="input" id="dz" rows="10" style="font-family:Caveat,cursive;font-size:22px;line-height:1.3">${esc(S().challenges)}</textarea>
      <div class="row" style="margin-top:12px"><button class="btn primary" id="dsave">Enregistrer</button><button class="btn" id="dshow">Lancer un défi à l'écran</button></div></div>`;
    $('#dsave').onclick = () => act(() => saveSettings({ challenges: $('#dz').value.split('\n').map(x => x.trim()).filter(Boolean).slice(0, 12).join('\n') })).then(() => toast('Défis enregistrés ✓'));
    $('#dshow').onclick = () => act(() => saveSettings({ mode: 'defi' }));
  }
  function tabQuiz() {
    const t = Object.values(cache.teams).filter(x => x.status !== 'del').sort((a, b) => (b.score || 0) - (a.score || 0));
    $('#body').innerHTML = `<div class="card">
      <div class="row" style="margin-bottom:14px;flex-wrap:nowrap"><input class="input" id="tn" placeholder="Nom de l'équipe (ex. Table des témoins)"><button class="btn primary" id="add">Ajouter</button></div>
      ${t.length ? t.map(x => `<div class="team"><b>${esc(x.name)}</b><div class="sc">${x.score || 0}</div>
        <div class="row" style="flex-wrap:nowrap"><button class="btn sm" data-q="-1" data-id="${x.id}">−1</button><button class="btn sm primary" data-q="1" data-id="${x.id}">+1</button><button class="btn sm primary" data-q="2" data-id="${x.id}">+2</button><button class="btn sm primary" data-q="5" data-id="${x.id}">+5</button><button class="btn sm danger" data-qd="${x.id}">✕</button></div></div>`).join('')
        : '<div class="empty">Aucune équipe. Ajoutez les tables ou les équipes.</div>'}
      <div class="row" style="margin-top:16px"><button class="btn primary" id="showq">🏆 Afficher le classement</button><button class="btn" id="rz">Remettre à zéro</button></div></div>`;
    const add = () => { const n = $('#tn').value.trim(); if (n) act(() => store.write('teams', uid(), { name: n.slice(0, 40), score: 0, status: 'ok' })); };
    $('#add').onclick = add; $('#tn').onkeydown = e => e.key === 'Enter' && add();
    $$('[data-q]').forEach(b => b.onclick = () => act(() => store.increment('teams', b.dataset.id, 'score', Number(b.dataset.q))));
    $$('[data-qd]').forEach(b => b.onclick = () => act(() => store.write('teams', b.dataset.qd, { status: 'del' }, true)));
    $('#showq').onclick = () => act(() => saveSettings({ mode: 'quiz' }));
    $('#rz').onclick = () => { if (confirm('Remettre tous les scores à 0 ?')) act(async () => { for (const x of t) await store.write('teams', x.id, { score: 0 }, true); }); };
  }
  function tabPerso() {
    const s = S();
    $('#body').innerHTML = `<div class="card" style="margin-bottom:16px"><h3 class="sec">🎨 Ambiance</h3>
      <div class="themes">${Object.entries(THEMES).map(([k, t]) => `<button data-th="${k}" class="${s.theme === k ? 'on' : ''}"><div class="sw" style="background:${t.sw}"><i style="background:${t.dot}"></i></div><b>${t.name}</b></button>`).join('')}</div>
      <div class="row" style="margin-top:14px"><label class="field" style="margin:0;flex:0 0 auto"><span>Couleur du mariage (facultatif)</span><input type="color" id="acc" value="${esc(s.accent || '#bf8840')}" style="height:46px;width:90px;padding:4px"></label>
        <button class="btn sm" id="accR">Couleur du thème</button></div></div>
      <div class="card"><h3 class="sec">💍 Les mariés</h3><div class="grid2">
        <div class="field"><span>Prénoms (ex. Julie &amp; Thomas)</span><input class="input" id="f-names" value="${esc(s.names)}"></div>
        <div class="field"><span>Phrase d'accueil</span><input class="input" id="f-sub" value="${esc(s.subtitle)}"></div>
        <div class="field"><span>Date</span><input class="input" type="date" id="f-date" value="${esc(s.date)}"></div>
        <div class="field"><span>Compte à rebours jusqu'à</span><input class="input" type="datetime-local" id="f-cd" value="${esc(s.countdownTo)}"></div>
        <div class="field"><span>Libellé du compte à rebours</span><input class="input" id="f-cdl" value="${esc(s.countdownLabel)}"></div>
        <div class="field"><span>Durée des annonces (secondes)</span><input class="input" type="number" min="5" max="120" id="f-as" value="${esc(s.announceSec)}"></div>
      </div><button class="btn primary" id="save">Enregistrer</button></div>`;
    $$('[data-th]').forEach(b => b.onclick = () => act(() => saveSettings({ theme: b.dataset.th })));
    $('#acc').onchange = e => act(() => saveSettings({ accent: e.target.value }));
    $('#accR').onclick = () => act(() => saveSettings({ accent: '' }));
    $('#save').onclick = () => act(() => saveSettings({ names: $('#f-names').value.trim(), subtitle: $('#f-sub').value.trim(), date: $('#f-date').value,
      countdownTo: $('#f-cd').value, countdownLabel: $('#f-cdl').value.trim(), announceSec: Math.max(5, Math.min(120, Number($('#f-as').value) || 20)) })).then(() => toast('Enregistré ✓'));
  }
  function tabQR() {
    const gu = viewUrl('invite'), sc = viewUrl('ecran');
    $('#body').innerHTML = `<div class="grid2">
      <div class="card"><h3 class="sec">📱 QR code des invités</h3><div class="linkbox"><div class="q" id="qrg"></div><div style="flex:1;min-width:180px"><code>${esc(gu)}</code>
        <div class="row" style="margin-top:12px"><button class="btn sm" id="cp">Copier le lien</button><button class="btn sm primary" id="pr">🖨️ Imprimer les chevalets</button></div></div></div></div>
      <div class="card"><h3 class="sec">📺 Installer le grand écran</h3><ol class="steps">
        <li>Branchez l'ordinateur au vidéoprojecteur ou à la TV (HDMI).</li>
        <li>Réglez l'affichage en « Étendre » (Windows : touches ⊞ + P).</li>
        <li>Cliquez sur <b>Ouvrir le grand écran</b>, faites glisser l'onglet sur le projecteur.</li>
        <li>Cliquez sur <b>▶ Lancer le grand écran</b> : il passe en plein écran.</li>
        <li>Pilotez tout depuis cette console (sur l'ordi ou votre téléphone).</li></ol>
        <p class="sub" style="margin-top:10px">Lien de l'écran : <code style="word-break:break-all">${esc(sc)}</code></p></div></div>`;
    makeQR($('#qrg'), gu, 170);
    $('#cp').onclick = () => navigator.clipboard?.writeText(gu).then(() => toast('Lien copié ✓'));
    $('#pr').onclick = () => {
      const tmp = document.createElement('div'); makeQR(tmp, gu, 640);
      const cv = tmp.querySelector('canvas'), img = cv ? cv.toDataURL() : '';
      const s = S(), w = window.open('', '_blank'); if (!w) return showError('Autorisez les fenêtres pop-up pour imprimer.');
      const card = `<div class="c"><div class="k">${esc(s.subtitle)}</div><div class="n">${namesHtml(s.names)}</div><img src="${img}"><div class="t">Scannez-moi !</div><div class="d">Partagez vos photos et vos mots doux<br>sur le grand écran ✨</div></div>`;
      w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Chevalets QR</title>
        <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Cormorant+Garamond:wght@500&family=Manrope:wght@600&display=swap" rel="stylesheet"><style>
        @page{size:A4;margin:10mm}body{margin:0;font-family:Manrope,sans-serif;color:#3b2f27}
        .g{display:grid;grid-template-columns:1fr 1fr;gap:8mm}.c{border:1.5px solid #e2cba6;border-radius:6mm;padding:7mm;text-align:center;height:132mm;display:flex;flex-direction:column;justify-content:center;align-items:center;page-break-inside:avoid;background:#fffaf1}
        .k{font-size:8pt;letter-spacing:.25em;text-transform:uppercase;color:#bf8840}.n{font-family:'Cormorant Garamond',serif;font-size:26pt;margin:2mm 0 4mm}.amp{font-family:Caveat,cursive;color:#bf8840}
        img{width:56mm;height:56mm}.t{font-family:Caveat,cursive;font-size:24pt;color:#bf8840;margin-top:3mm}.d{font-size:10pt;line-height:1.5;color:#7a6a5c}
        </style></head><body><div class="g">${card.repeat(4)}</div><script>setTimeout(()=>print(),900)<\/script></body></html>`);
      w.document.close();
    };
  }

  render();
  startSync(['settings', 'photos', 'messages', 'teams', 'reactions'], () => {
    const ae = document.activeElement;
    if (ae && ['INPUT', 'TEXTAREA'].includes(ae.tagName) && !['checkbox', 'range', 'color'].includes(ae.type)) return;
    const y = scrollY; render(); scrollTo(0, y);
  });
}

/* =====================================================================
   8. ROUTAGE
   ===================================================================== */
({ ecran: viewScreen, invite: viewGuest, console: viewConsole }[VIEW] || viewHome)();
</script>
</body>
