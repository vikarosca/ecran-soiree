<!doctype html>
<html lang="fr" data-design="guinguette">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6ead8">
<title>Écran de soirée — Universal DJ Normandie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fontlink" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* =====================================================================
   ÉCRAN DE SOIRÉE v4 — Universal DJ Normandie
   5 designs (Prestige · Guinguette · Bohème · Pop Party · Disco), 3 palettes chacun
     ?v=ecran&e=CODE    → grand écran
     ?v=invite&e=CODE   → page invités
     ?v=console&e=CODE  → console DJ
   ===================================================================== */
:root{
  --bg1:#fffaf1; --bg2:#f1e2cc; --ink:#3b2f27; --muted:#8b7a6b; --card:#fff; --card2:#fbf5ec; --line:#eadbc6;
  --accent:#bf8840; --accent2:#e9b96c; --glow:255,190,110; --paper:#fffdf8; --paperInk:#3b2f27; --shadow:rgba(90,60,30,.22); --onaccent:#fff;
  --fd:'Cormorant Garamond',Georgia,serif; --fs:'Caveat',cursive; --fb:'Manrope',system-ui,sans-serif; --rad:22px; --brad:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;color:var(--ink);font-family:var(--fb);-webkit-font-smoothing:antialiased;
  background:radial-gradient(120% 90% at 50% 0%,var(--bg1) 0%,var(--bg2) 100%) fixed;background-color:var(--bg2)}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent)}
.serif{font-family:var(--fd)} .hand{font-family:var(--fs)}
.kicker{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:700}
.demo-banner{background:#7a4a12;color:#fff2da;font-size:13px;padding:8px 14px;text-align:center;position:relative;z-index:5}
.demo-banner a{color:#ffd79a}
#toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-140%);z-index:200;background:var(--card);color:var(--ink);border:1px solid var(--line);
  box-shadow:0 12px 40px var(--shadow);padding:12px 18px;border-radius:40px;font-weight:600;transition:transform .5s cubic-bezier(.2,.9,.2,1),opacity .4s;max-width:92vw;text-align:center;opacity:0;pointer-events:none}
#toast.on{transform:translate(-50%,0);opacity:1}
.btn{border:1px solid var(--line);background:var(--card);padding:11px 16px;border-radius:var(--brad);cursor:pointer;font-weight:600;transition:.15s;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
a.btn{text-decoration:none;display:inline-block}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;color:var(--onaccent);box-shadow:0 8px 22px rgba(var(--glow),.35)}
.btn.danger{border-color:#d9605a;color:#d9605a;background:transparent}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:calc(var(--brad) * .75)}
.btn.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--onaccent);border-color:transparent}
.btn:disabled{opacity:.5;cursor:default}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>span{font-size:13px;color:var(--muted);font-weight:600}
.field input,.field textarea,.field select,.input{background:var(--card2);border:1.5px solid var(--line);border-radius:var(--brad);padding:12px 14px;outline:none;width:100%;color:var(--ink)}
.field input:focus,.input:focus{border-color:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.05)}
.err-banner{position:fixed;left:12px;bottom:12px;z-index:300;background:#7d2222;color:#fff;padding:9px 13px;border-radius:10px;font-size:13px;max-width:90vw;display:none}

/* ---------- ornements d'en-tête (invités / console) ---------- */
.garland{display:block;width:100%;overflow:visible}
.garland .bulb{animation:tw 2.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.45}}
.deco{height:64px;display:flex;align-items:center;justify-content:center;gap:14px;color:var(--accent)}
.deco-prestige span{display:block;height:1px;width:min(30vw,220px);background:linear-gradient(90deg,transparent,var(--accent),transparent)}
.deco-prestige b{font-size:13px;letter-spacing:.5em;font-weight:400}
.deco-disco{font-size:40px;filter:drop-shadow(0 0 14px rgba(var(--glow),.9));animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- accueil ---------- */
.home{max-width:660px;margin:0 auto;padding:10px 16px 50px}
.home h1{font-family:var(--fd);font-weight:500;font-size:46px;margin:6px 0}
.home p{color:var(--muted);line-height:1.6}
.home .views{display:grid;gap:12px;margin-top:20px}
.home .views a{text-decoration:none;color:var(--ink);display:block}
.home .views b{font-size:18px}

/* =========================== GRAND ÉCRAN =========================== */
.screen{position:fixed;inset:0;overflow:hidden;cursor:none}
.screen.cur{cursor:default}
#amb{position:absolute;inset:0;width:100%;height:100%}
#stage{position:absolute;inset:0}
.scene{position:absolute;inset:0;opacity:0;transition:opacity 1.1s ease}
.scene.in{opacity:1}.scene.out{opacity:0}
.frame-deco{position:absolute;inset:2.2vh;border:1px solid rgba(var(--glow),.55);pointer-events:none;z-index:15;display:none}
.frame-deco::before{content:"";position:absolute;inset:.8vh;border:1px solid rgba(var(--glow),.3)}
.frame-deco i{position:absolute;width:1.6vh;height:1.6vh;background:var(--accent);transform:rotate(45deg)}
.frame-deco i:nth-child(1){left:-.8vh;top:-.8vh}.frame-deco i:nth-child(2){right:-.8vh;top:-.8vh}.frame-deco i:nth-child(3){left:-.8vh;bottom:-.8vh}.frame-deco i:nth-child(4){right:-.8vh;bottom:-.8vh}
[data-design="prestige"] .frame-deco{display:block}

/* accueil */
.welcome{position:absolute;inset:0;display:grid;grid-template-columns:1.35fr 1fr;align-items:center;padding:7vh 6.5vw;gap:4vw}
.welcome.noqr{grid-template-columns:1fr;text-align:center}
.welcome .sub{font-size:1.5vw;letter-spacing:.35em;text-transform:uppercase;color:var(--accent);font-weight:700}
.welcome .names{font-family:var(--fd);font-weight:500;font-size:8.6vw;line-height:.98;margin:2.4vh 0;color:var(--ink)}
.welcome .names .amp{font-family:var(--fs);color:var(--accent);font-size:.8em;padding:0 .12em}
.welcome .date{font-family:var(--fd);font-style:italic;font-size:2.8vw;color:var(--muted)}
.welcome .orn{display:none}
.welcome .cd{margin-top:4vh}
.welcome .cd .l{font-size:1.15vw;letter-spacing:.25em;text-transform:uppercase;color:var(--muted);font-weight:700}
.welcome .cd .v{font-family:var(--fd);font-size:6vw;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.05}
.bigqr{justify-self:center;text-align:center;background:var(--paper);color:var(--paperInk);padding:2.4vw 2.4vw 1.6vw;border-radius:2vw;box-shadow:0 3vh 8vh var(--shadow);transform:rotate(2deg);animation:float 6s ease-in-out infinite}
.bigqr .q{line-height:0;display:inline-block;background:#fff;padding:.6vw;border-radius:.6vw}
.bigqr .q img,.bigqr .q canvas{width:19vw!important;height:19vw!important;max-width:33vh!important;max-height:33vh!important}
.bigqr .t{font-family:var(--fs);font-size:2.6vw;line-height:1.1;margin-top:1.2vh}
.bigqr .t small{display:block;font-family:var(--fb);font-size:1vw;letter-spacing:.12em;text-transform:uppercase;opacity:.6;margin-top:.6vh}
@keyframes float{0%,100%{transform:rotate(2deg) translateY(0)}50%{transform:rotate(1deg) translateY(-1.2vh)}}

/* ---- mur : polaroïds (Guinguette) ---- */
.wall-item{position:absolute;transform:translate(-50%,-50%) rotate(var(--r))}
.pola{background:var(--paper);padding:1.1vw 1.1vw 0;box-shadow:0 2.4vh 6vh var(--shadow),0 .3vh .8vh rgba(0,0,0,.12);border-radius:.3vw}
.pola::before{content:"";position:absolute;top:-1.4vh;left:50%;width:7vw;height:3.2vh;transform:translateX(-50%) rotate(-3deg);background:rgba(var(--glow),.55)}
.pola .ph,.stick .ph,.hang .ph{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:#e9e1d6}
.cap{font-family:var(--fs);color:var(--paperInk);text-align:center;padding:.8vh .4vw 1.4vh;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap small{display:block;font-family:var(--fb);font-size:.62em;letter-spacing:.14em;text-transform:uppercase;opacity:.55;margin-top:.3vh}
.likes{position:absolute;right:1vw;bottom:1.1vh;font-family:var(--fb);font-weight:700;color:#d24c5c;font-size:1vw}
.drop{animation:drop 1.1s cubic-bezier(.2,1.25,.3,1) both}
@keyframes drop{from{opacity:0;transform:translate(-50%,-50%) translateY(-30vh) rotate(calc(var(--r) * 3)) scale(1.15)}to{opacity:1;transform:translate(-50%,-50%) rotate(var(--r))}}
/* ---- mur : galerie (Prestige) ---- */
.gallery{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:2.6vw;padding:0 6vw}
.gframe{background:var(--paper);padding:1.6vh;box-shadow:0 3vh 7vh var(--shadow);position:relative;opacity:0;animation:fadeup 1.4s ease forwards}
.gframe::after{content:"";position:absolute;inset:.7vh;border:1px solid rgba(var(--glow),.8);pointer-events:none}
.gframe img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover}
.gframe .gc{text-align:center;font-family:var(--fd);font-style:italic;color:var(--paperInk);font-size:2.2vh;padding:1.4vh 0 .4vh;letter-spacing:.04em}
@keyframes fadeup{from{opacity:0;transform:translateY(4vh)}to{opacity:1;transform:none}}
/* ---- mur : corde à linge (Bohème) ---- */
.line-svg{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.hang{position:absolute;transform:translateX(-50%);transform-origin:50% 0;animation:swing 5s ease-in-out infinite,hangin 1.2s cubic-bezier(.2,1.2,.3,1) both}
.hang .pp{background:var(--paper);padding:.8vw .8vw 0;box-shadow:0 2vh 4vh var(--shadow)}
.hang .peg{position:absolute;left:50%;top:-2.2vh;width:1.3vw;height:4.2vh;margin-left:-.65vw;background:linear-gradient(90deg,#b98a5a,#d7ab78,#b98a5a);border-radius:.3vw;box-shadow:0 .4vh .6vh rgba(0,0,0,.25);z-index:2}
@keyframes swing{0%,100%{transform:translateX(-50%) rotate(var(--r))}50%{transform:translateX(-50%) rotate(calc(var(--r) * -1))}}
@keyframes hangin{from{opacity:0;margin-top:-20vh}to{opacity:1;margin-top:0}}
/* ---- mur : stickers (Pop Party) ---- */
.stick{background:#fff;padding:.9vw;border-radius:1.6vw;box-shadow:1.2vh 1.2vh 0 var(--accent2);animation:popin .9s cubic-bezier(.3,1.8,.4,1) both}
.stick .ph{border-radius:1vw}
.stick .cap{font-family:var(--fd);font-weight:700;color:#2d1b4e}
.stick .emo{position:absolute;right:-2.2vh;top:-2.6vh;font-size:6vh;transform:rotate(14deg);filter:drop-shadow(0 .5vh .6vh rgba(0,0,0,.25))}
@keyframes popin{from{opacity:0;transform:translate(-50%,-50%) scale(0) rotate(-30deg)}to{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(var(--r))}}
/* ---- mur : néons (Disco) ---- */
.neonrow{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:3vw;padding:0 5vw}
.nframe{border:.45vh solid var(--c);border-radius:1.4vh;padding:.8vh;background:rgba(0,0,0,.35);box-shadow:0 0 2.5vh var(--c),inset 0 0 2vh var(--c);animation:neonpulse 2.6s ease-in-out infinite,fadeup 1.2s ease both}
.nframe img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:.8vh}
.nframe .nc{text-align:center;font-family:var(--fs);color:#fff;font-size:3vh;padding:.8vh 0 .2vh;text-shadow:0 0 1.2vh var(--c)}
@keyframes neonpulse{0%,100%{box-shadow:0 0 2.5vh var(--c),inset 0 0 2vh var(--c)}50%{box-shadow:0 0 5vh var(--c),inset 0 0 3vh var(--c)}}

/* ---- vedette ---- */
.ved-bg{position:absolute;inset:-6%;background-size:cover;background-position:center;filter:blur(46px) saturate(1.2);opacity:.5;transform:scale(1.08)}
.ved{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.ved figure{margin:0;position:relative;background:var(--paper);padding:1.4vh 1.4vh 0;border-radius:.5vh;box-shadow:0 4vh 10vh var(--shadow);transform:rotate(var(--r));animation:vin 1.3s cubic-bezier(.2,1.1,.3,1) both}
.ved img{display:block;max-height:75vh;max-width:84vw;border-radius:.2vh}
.ved figcaption{font-family:var(--fs);color:var(--paperInk);text-align:center;font-size:4.4vh;padding:1vh 2vh 1.6vh;line-height:1.1}
.ved figcaption small{font-family:var(--fb);font-size:1.6vh;letter-spacing:.16em;text-transform:uppercase;opacity:.6;margin-left:1.2vh}
@keyframes vin{from{opacity:0;transform:rotate(calc(var(--r) - 6deg)) scale(.82) translateY(6vh)}to{opacity:1;transform:rotate(var(--r)) scale(1)}}
.ribbon{position:absolute;top:2.2vh;right:-1.2vh;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--onaccent);font-weight:700;font-size:1.8vh;letter-spacing:.14em;text-transform:uppercase;padding:.8vh 2vh;border-radius:.6vh;box-shadow:0 1vh 2vh rgba(0,0,0,.2);z-index:3}
.defi-tag{position:absolute;top:2.2vh;left:-1.2vh;background:var(--paper);color:var(--paperInk);font-family:var(--fs);font-size:3.2vh;padding:.4vh 2vh;border-radius:.6vh;box-shadow:0 1vh 2vh rgba(0,0,0,.2);transform:rotate(-3deg);max-width:40vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:3}

/* ---- mosaïque ---- */
.mosa{position:absolute;inset:0;display:grid;gap:.5vw;padding:.5vw}
.mosa div{background:#000 center/cover no-repeat;border-radius:.6vw;opacity:0;animation:tile .9s ease forwards}
@keyframes tile{from{opacity:0;transform:scale(.85) rotateY(70deg)}to{opacity:1;transform:none}}
.mosa-card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--card);opacity:.94;padding:3.5vh 4.5vw;border-radius:3vh;text-align:center;box-shadow:0 4vh 10vh var(--shadow)}
.mosa-card .n{font-family:var(--fd);font-size:6vw;line-height:1}
.mosa-card .n .amp{font-family:var(--fs);color:var(--accent)}
.mosa-card .s{font-family:var(--fs);font-size:2.6vw;color:var(--accent);margin-top:1vh}

/* ---- mot doux ---- */
.mot{position:absolute;left:50%;top:50%;width:min(70vw,140vh);transform:translate(-50%,-50%) rotate(var(--r));background:var(--paper);color:var(--paperInk);border-radius:1vh;
  padding:7vh 6vw 6vh;box-shadow:0 4vh 10vh var(--shadow);animation:motin 1.2s cubic-bezier(.2,1.1,.3,1) both;
  background-image:repeating-linear-gradient(transparent 0 6.4vh,rgba(var(--glow),.18) 6.4vh calc(6.4vh + 2px))}
@keyframes motin{from{opacity:0;transform:translate(-50%,-44%) rotate(calc(var(--r) + 4deg)) scale(.9)}to{opacity:1;transform:translate(-50%,-50%) rotate(var(--r))}}
.mot .k{position:absolute;top:2.4vh;left:6vw;font-size:1.6vh;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);font-weight:700}
.mot .t{font-family:var(--fs);line-height:1.12}
.mot .t.s{font-size:9vh}.mot .t.m{font-size:6.6vh}.mot .t.l{font-size:4.8vh}
.mot .a{margin-top:3vh;font-family:var(--fs);font-size:5vh;color:var(--accent);text-align:right}
.mot .seal{position:absolute;right:-2.6vh;top:-2.6vh;width:9vh;height:9vh;border-radius:50%;background:radial-gradient(circle at 35% 35%,#e06a6a,#9c2733);display:flex;align-items:center;justify-content:center;color:#ffe3dc;font-size:4vh;box-shadow:0 1vh 2vh rgba(0,0,0,.3)}

/* ---- défi / quiz / noir ---- */
.defi{position:absolute;inset:0;display:grid;grid-template-columns:1.4fr 1fr;align-items:center;padding:7vh 6.5vw;gap:4vw}
.defi .k{font-size:1.5vw;letter-spacing:.3em;text-transform:uppercase;color:var(--accent);font-weight:700}
.defi .t{font-family:var(--fs);font-size:6.4vw;line-height:1.02;margin:2vh 0}
.defi .s{font-size:1.6vw;color:var(--muted);line-height:1.5}
.quiz{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(82vw,1500px)}
.quiz h2{font-family:var(--fd);font-weight:500;text-align:center;font-size:5vw;margin:0 0 4vh}
.quiz h2 span{font-family:var(--fs);color:var(--accent)}
.qrow{display:grid;grid-template-columns:5vw 1fr 8vw;align-items:center;gap:1.5vw;margin:1.3vh 0;font-size:2.4vw}
.qrow .rk{font-family:var(--fd);color:var(--muted);text-align:right}
.qbar{position:relative;height:5.6vh;background:rgba(var(--glow),.14);border-radius:3vh;overflow:hidden}
.qbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,rgba(var(--glow),.4),var(--accent));border-radius:3vh;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.qbar span{position:absolute;left:1.4vw;top:50%;transform:translateY(-50%);font-weight:700;color:var(--ink)}
.qwin{text-align:center;font-family:var(--fs);font-size:4.4vw;color:var(--accent);margin:-2vh 0 3vh;animation:winpop 1.2s cubic-bezier(.2,1.4,.4,1) both;text-shadow:0 .6vh 3vh rgba(var(--glow),.45)}
@keyframes winpop{0%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:scale(1)}}
.qrow.top .qbar{box-shadow:0 0 0 .5vh var(--accent)}
.qrow .sc{font-family:var(--fd);font-size:3.2vw;font-variant-numeric:tabular-nums}
.noir{position:absolute;inset:0;background:#000;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4vh;font-family:var(--fs);color:#3a3028;font-size:2vw}

/* ---- calques ---- */
.qrbox{position:absolute;right:2vw;bottom:2.8vh;display:flex;align-items:center;gap:1.1vw;background:var(--paper);color:var(--paperInk);border-radius:1.6vw;padding:1vw 1.4vw 1vw 1vw;
  box-shadow:0 2vh 5vh var(--shadow);transition:opacity .6s,transform .6s;transform:rotate(-1.5deg);z-index:20}
.qrbox .q{line-height:0;background:#fff;padding:.4vh;border-radius:.6vh}
.qrbox .q img,.qrbox .q canvas{width:10.5vh!important;height:10.5vh!important}
.qrbox .t{font-family:var(--fs);font-size:3.3vh;line-height:1}
.qrbox .t small{display:block;font-family:var(--fb);font-size:1.25vh;letter-spacing:.14em;text-transform:uppercase;opacity:.55;margin-top:.7vh}
.qrbox.hide{opacity:0;transform:translateY(4vh)}
.qrbox.qzmode{box-shadow:0 0 0 .5vh var(--accent),0 2vh 5vh var(--shadow)}
.qzqr .qz{padding-bottom:19vh}
.updbadge{position:absolute;left:50%;top:2vh;transform:translate(-50%,-14vh);z-index:40;background:var(--card);color:var(--ink);border:2px solid var(--accent);border-radius:3vh;padding:1vh 2vw;font-size:2vh;box-shadow:0 1vh 3vh var(--shadow);transition:transform .6s}
.updbadge.on{transform:translate(-50%,0)}
.stats{position:absolute;left:2.4vw;top:2.8vh;display:flex;gap:.8vw;z-index:20;transition:opacity .6s}
.stats span{background:var(--card);opacity:.88;border:1px solid rgba(var(--glow),.3);padding:.7vh 1.2vw;border-radius:3vh;font-weight:700;font-size:1.8vh;color:var(--ink)}
.stats.hide{opacity:0}
.flyer{position:absolute;bottom:-8vh;font-size:5.5vh;z-index:30;pointer-events:none;animation:fly var(--d) ease-out forwards}
@keyframes fly{0%{transform:translate(0,0) scale(.6);opacity:0}10%{opacity:1}100%{transform:translate(var(--x),-105vh) scale(1.25) rotate(var(--rot));opacity:0}}
.annonce{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;text-align:center;
  background:radial-gradient(circle at 50% 50%,rgba(var(--glow),.5),transparent 70%),radial-gradient(120% 90% at 50% 0%,var(--bg1),var(--bg2));opacity:0;pointer-events:none;transition:opacity .8s}
.annonce.on{opacity:1}
.annonce .k{font-size:2vw;letter-spacing:.4em;text-transform:uppercase;color:var(--accent);font-weight:700}
.annonce .t{font-family:var(--fs);font-size:10vw;line-height:1;margin-top:2vh;padding:0 5vw;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.toastbig{position:absolute;left:50%;top:3vh;transform:translate(-50%,-160%);z-index:40;background:var(--paper);color:var(--paperInk);padding:1.4vh 2.4vw;border-radius:5vh;font-weight:700;font-size:2.2vh;box-shadow:0 2vh 5vh var(--shadow);transition:transform .7s cubic-bezier(.2,1.2,.3,1),opacity .5s;opacity:0}
.toastbig.on{transform:translate(-50%,0);opacity:1}
.start{position:absolute;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh;background:radial-gradient(circle,rgba(0,0,0,.25),rgba(0,0,0,.6));cursor:default;text-align:center;color:#fff}
.start button{font-size:3.2vh;padding:2.4vh 5vh;border-radius:6vh}
.start p{max-width:60vw;font-size:2vh;line-height:1.6;opacity:.9}

/* =================== VARIANTES DE DESIGN =================== */
/* PRESTIGE : symétrie, filets dorés, capitales espacées, aucune inclinaison */
[data-design="prestige"]{--rad:6px;--brad:4px}
[data-design="prestige"] .btn{text-transform:uppercase;letter-spacing:.12em;font-size:13px}
[data-design="prestige"] .welcome .names{text-transform:uppercase;letter-spacing:.06em;font-weight:400;font-size:6.6vw;line-height:1.08}
[data-design="prestige"] .welcome .names .amp{display:block;text-transform:none;letter-spacing:0;font-size:.9em;line-height:.9;margin:1vh 0}
[data-design="prestige"] .welcome .orn{display:flex;align-items:center;gap:1.4vw;color:var(--accent);margin:2.6vh 0}
.welcome .orn span{height:1px;width:9vw;background:linear-gradient(90deg,transparent,var(--accent),transparent)}
[data-design="prestige"] .welcome.noqr .orn{justify-content:center}
[data-design="prestige"] .bigqr,[data-design="prestige"] .qrbox{transform:none;animation:none;border-radius:0;outline:1px solid rgba(var(--glow),.8);outline-offset:-.9vh}
[data-design="prestige"] .ved figure{transform:none;padding:2vh;border-radius:0;animation:fadeup 1.6s ease both}
[data-design="prestige"] .ved figure::after{content:"";position:absolute;inset:.8vh;border:1px solid rgba(var(--glow),.85);pointer-events:none}
[data-design="prestige"] .ved figcaption{font-family:var(--fd);font-style:italic;font-size:3.4vh}
[data-design="prestige"] .mot{transform:translate(-50%,-50%);background-image:none;text-align:center;border-radius:0;animation:motfade 1.4s ease both}
@keyframes motfade{from{opacity:0;transform:translate(-50%,-44%)}to{opacity:1;transform:translate(-50%,-50%)}}
@keyframes motpop{from{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-12deg)}to{opacity:1;transform:translate(-50%,-50%) rotate(var(--r)) scale(1)}}
[data-design="prestige"] .mot::after{content:"";position:absolute;inset:1.4vh;border:1px solid rgba(var(--glow),.8);pointer-events:none}
[data-design="prestige"] .mot .k{left:0;right:0;text-align:center}
[data-design="prestige"] .mot .a{text-align:center}
[data-design="prestige"] .mot .seal{left:50%;right:auto;top:-4.5vh;margin-left:-4.5vh;background:var(--paper);border:1px solid var(--accent);color:var(--accent);font-family:var(--fs);font-size:4.4vh}
[data-design="prestige"] .ribbon{border-radius:0;right:2vh}
[data-design="prestige"] .defi-tag{transform:none;border-radius:0;left:2vh}
[data-design="prestige"] .mosa div{border-radius:0}
[data-design="prestige"] .stats span{border-radius:0;text-transform:uppercase;letter-spacing:.1em;font-size:1.5vh}

/* BOHÈME : papier kraft, washi, nature */
[data-design="boheme"]{--rad:18px;--brad:30px}
[data-design="boheme"] .welcome .names{text-transform:uppercase;font-weight:700;letter-spacing:.04em;font-size:9vw}
[data-design="boheme"] .welcome .names .amp{text-transform:none}
[data-design="boheme"] .ved figure::before{content:"";position:absolute;top:-1.6vh;left:50%;width:12vw;height:3.6vh;transform:translateX(-50%) rotate(-2deg);background:repeating-linear-gradient(45deg,rgba(var(--glow),.75) 0 1vh,rgba(255,255,255,.4) 1vh 2vh);z-index:2}
[data-design="boheme"] .mot{background-image:radial-gradient(rgba(120,90,50,.08) 1px,transparent 1px);background-size:6px 6px}
[data-design="boheme"] .mot .seal{background:radial-gradient(circle at 35% 35%,#9fb88a,#5f7a4c);color:#f4f7ec}
[data-design="boheme"] .bigqr,[data-design="boheme"] .qrbox{border-radius:3vh}

/* POP PARTY : couleurs franches, rondeurs, ombres décalées, rebonds */
[data-design="pop"]{--rad:28px;--brad:40px}
[data-design="pop"] .btn{font-weight:700}
[data-design="pop"] .welcome .names{font-weight:700;letter-spacing:-.02em;text-shadow:.7vh .7vh 0 var(--accent2)}
[data-design="pop"] .welcome .names .amp{display:inline-block;animation:wiggle 1.6s ease-in-out infinite;text-shadow:none}
@keyframes wiggle{0%,100%{transform:rotate(-8deg) scale(1)}50%{transform:rotate(8deg) scale(1.12)}}
[data-design="pop"] .bigqr,[data-design="pop"] .qrbox{border-radius:3vh;box-shadow:1.2vh 1.2vh 0 var(--accent2)}
[data-design="pop"] .ved figure{background:#fff;padding:1.6vh;border-radius:2.4vh;box-shadow:1.8vh 1.8vh 0 var(--accent2);animation:popv 1s cubic-bezier(.3,1.7,.4,1) both}
[data-design="pop"] .ved img{border-radius:1.4vh}
[data-design="pop"] .ved figcaption{font-family:var(--fd);font-weight:700;color:#2d1b4e}
@keyframes popv{from{opacity:0;transform:scale(.3) rotate(-12deg)}to{opacity:1;transform:rotate(var(--r)) scale(1)}}
[data-design="pop"] .mot{background:#fff;background-image:none;border:.7vh solid var(--ink);border-radius:5vh;box-shadow:1.6vh 1.6vh 0 var(--accent);color:#2d1b4e;animation:motpop 1s cubic-bezier(.3,1.7,.4,1) both}
[data-design="pop"] .mot::after{content:"";position:absolute;left:12%;bottom:-4.6vh;border:2.4vh solid transparent;border-top:3vh solid var(--ink)}
[data-design="pop"] .mot .t{font-family:var(--fd);font-weight:700}
[data-design="pop"] .mot .seal{background:var(--accent2);color:#fff}
[data-design="pop"] .quiz h2,[data-design="pop"] .mosa-card .n{font-weight:700}
[data-design="pop"] .defi .t{font-family:var(--fd);font-weight:700}
[data-design="pop"] .mosa div{border-radius:2vw}

/* DISCO : néons, boule à facettes, nuit */
[data-design="disco"]{--rad:16px;--brad:12px}
[data-design="disco"] .btn.primary{box-shadow:0 0 18px rgba(var(--glow),.7)}
[data-design="disco"] .welcome .names{text-shadow:0 0 1.2vh rgba(var(--glow),.9),0 0 4vh rgba(var(--glow),.6);animation:flicker 5s infinite}
[data-design="disco"] .welcome .names .amp{color:var(--accent2);text-shadow:0 0 2vh var(--accent2)}
@keyframes flicker{0%,18%,22%,25%,53%,57%,100%{opacity:1}20%,24%,55%{opacity:.75}}
[data-design="disco"] .bigqr,[data-design="disco"] .qrbox{background:#0c0614;color:#fff;border:.35vh solid var(--accent);box-shadow:0 0 3vh var(--accent),inset 0 0 2vh rgba(var(--glow),.4);transform:none}
[data-design="disco"] .ved figure{background:#0c0614;border:.5vh solid var(--accent);box-shadow:0 0 4vh var(--accent),0 0 12vh var(--accent2);transform:none}
[data-design="disco"] .ved figcaption{color:#fff;text-shadow:0 0 1.4vh var(--accent)}
[data-design="disco"] .mot{background:#0c0614;background-image:none;border:.4vh solid var(--accent2);box-shadow:0 0 4vh var(--accent2);transform:translate(-50%,-50%)}
[data-design="disco"] .mot .t{color:#fff;text-shadow:0 0 1.6vh var(--accent)}
[data-design="disco"] .mot .a{color:var(--accent2);text-shadow:0 0 1.4vh var(--accent2)}
[data-design="disco"] .mot .seal{background:radial-gradient(circle at 35% 35%,#fff,#9aa3b5);color:#333}
[data-design="disco"] .annonce .t,[data-design="disco"] .defi .t,[data-design="disco"] .quiz h2{text-shadow:0 0 2vh rgba(var(--glow),.9)}
[data-design="disco"] .stats span{background:#0c0614;color:#fff;border-color:var(--accent);box-shadow:0 0 1.2vh rgba(var(--glow),.6)}


/* ---- quiz en direct (grand écran) ---- */
.qz{position:absolute;inset:0;padding:9vh 7vw 8vh;display:flex;flex-direction:column;justify-content:center;gap:3.6vh}
.qz-top{display:flex;justify-content:space-between;font-size:1.5vw;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:700}
.qz-q{font-family:var(--fd);font-size:4.4vw;line-height:1.12;color:var(--ink);text-align:center;animation:fadeup .9s ease both}
.qz-ch{display:grid;grid-template-columns:1fr 1fr;gap:2.4vh 2vw}
.qz-c{display:flex;align-items:center;gap:1.4vw;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:var(--rad);padding:2.2vh 2vw;font-size:2.4vw;line-height:1.15;box-shadow:0 1.6vh 4vh var(--shadow);transition:all .7s;animation:fadeup .9s ease both}
.qz-c:nth-child(2){animation-delay:.12s}.qz-c:nth-child(3){animation-delay:.24s}.qz-c:nth-child(4){animation-delay:.36s}
.qz-c b{width:5.4vh;height:5.4vh;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--onaccent);font-size:2.6vh;flex:none}
.qz-ch.two{grid-template-columns:1fr 1fr}.qz-ch.two .qz-c{font-size:4vw;justify-content:center;padding:4vh 2vw;font-family:var(--fs)}
.qz-c.ok{border-color:#3fbf6f;box-shadow:0 0 0 .7vh rgba(63,191,111,.4),0 1.6vh 4vh var(--shadow);transform:scale(1.05)}
.qz-c.ok b{background:#3fbf6f;color:#fff}
.qz-c.no{opacity:.3;transform:scale(.97)}
.qz-foot{text-align:center;font-size:2.6vw;color:var(--muted);min-height:5vh;font-family:var(--fs)}
.qz-foot .tm{display:inline-block;font-family:var(--fb);font-weight:700;font-size:3vw;color:var(--accent);font-variant-numeric:tabular-nums}
.qz-foot .tm.low{color:#e2574c;animation:pulse .6s ease-in-out infinite}
.savebadge{position:absolute;left:2.4vw;bottom:2.8vh;z-index:25;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:3vh;padding:.8vh 1.4vw;font-size:1.7vh;font-weight:700;opacity:0;transition:opacity .6s;box-shadow:0 1vh 3vh var(--shadow)}
.screen.cur .savebadge,.savebadge.flash{opacity:.95}
.start .saveinfo{font-size:1.8vh;opacity:.9;max-width:60vw;margin-top:-1vh}
/* ---- console : bibliothèque de quiz ---- */
.qlib{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.qlib button{border:2px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;background:var(--card);text-align:left;color:var(--ink)}
.qlib button.on{border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--glow),.35)}
.qlib .e{font-size:28px;display:block;margin-bottom:6px}
.qlib b{display:block;font-size:15px}
.qlib small{color:var(--muted);font-size:12px}
.qans{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qans div{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px}
.qans div.good{border-color:#3fbf6f;background:rgba(63,191,111,.12);font-weight:700}

/* =========================== INVITÉS =========================== */
.guest{max-width:540px;margin:0 auto;padding:0 16px 150px;position:relative}
.g-hero{text-align:center;padding:4px 0 10px}
.g-hero .names{font-family:var(--fd);font-size:44px;line-height:1.05;margin:6px 0 2px}
.g-hero .names .amp{font-family:var(--fs);color:var(--accent);font-size:.85em}
[data-design="prestige"] .g-hero .names{text-transform:uppercase;letter-spacing:.06em;font-size:34px;font-weight:400}
[data-design="boheme"] .g-hero .names{text-transform:uppercase;font-weight:700;font-size:48px}
[data-design="pop"] .g-hero .names{font-weight:700;text-shadow:3px 3px 0 var(--accent2)}
[data-design="disco"] .g-hero .names{text-shadow:0 0 10px rgba(var(--glow),.9)}
.g-hero .date{color:var(--muted);font-family:var(--fd);font-style:italic;font-size:19px}
.hello{font-family:var(--fs);font-size:26px;color:var(--accent);text-align:center;margin:6px 0 14px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.act{border-radius:var(--rad);padding:22px 14px;text-align:left;cursor:pointer;background:var(--card);box-shadow:0 10px 26px rgba(0,0,0,.07);border:1px solid var(--line);position:relative;overflow:hidden;color:var(--ink)}
.act .e{font-size:34px;display:block;margin-bottom:10px}
.act b{display:block;font-size:17px}
.act small{color:var(--muted);font-size:13px}
.act.main{grid-column:1/-1;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--onaccent);border:0;padding:26px 20px}
.act.main small{color:inherit;opacity:.85}
.act.main::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.18)}
[data-design="prestige"] .act b{text-transform:uppercase;letter-spacing:.12em;font-size:14px;font-weight:600}
[data-design="pop"] .act{box-shadow:6px 6px 0 var(--accent2);border:2px solid var(--ink)}
[data-design="disco"] .act{box-shadow:0 0 16px rgba(var(--glow),.35)}
.back{background:none;border:0;color:var(--muted);font-weight:600;padding:8px 0;cursor:pointer;margin-bottom:6px}
.pick{display:block;border:2px dashed var(--line);border-radius:var(--rad);padding:34px 16px;text-align:center;cursor:pointer;color:var(--muted);background:var(--card)}
.pick b{display:block;color:var(--ink);font-size:18px;margin:6px 0 4px}
.pick .e{font-size:40px}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px}
.defi-chip{display:inline-block;background:rgba(var(--glow),.2);color:var(--ink);border-radius:20px;padding:6px 12px;font-weight:600;font-size:14px;margin-bottom:12px}
.defis{display:grid;gap:10px}
.defis button{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--rad);padding:16px;cursor:pointer;font-family:var(--fs);font-size:26px;color:var(--ink);display:flex;justify-content:space-between;align-items:center;gap:10px}
.defis button span{font-family:var(--fb);font-size:13px;color:var(--accent);font-weight:700;white-space:nowrap}
.success{text-align:center;padding:30px 10px}
.success .e{font-size:64px;animation:pop .8s cubic-bezier(.2,1.6,.4,1)}
.success h2{font-family:var(--fs);font-size:40px;margin:10px 0 4px;color:var(--accent)}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.fil{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.fil button{border:0;padding:0;aspect-ratio:1;background:#ddd center/cover;border-radius:10px;cursor:pointer;position:relative}
.fil button i{position:absolute;right:5px;bottom:4px;font-style:normal;font-size:11px;font-weight:700;background:rgba(0,0,0,.45);color:#fff;border-radius:10px;padding:1px 6px}
.lb{position:fixed;inset:0;z-index:150;background:rgba(10,6,3,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;color:#fff}
.lb img{max-width:100%;max-height:70vh;border-radius:10px}
.lb .meta{margin:12px 0;text-align:center;font-family:var(--fs);font-size:24px}
/* ---- quiz sur le téléphone invité ---- */
.gq-banner{position:fixed;left:12px;right:12px;top:12px;z-index:70;display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--onaccent);border:0;border-radius:18px;padding:14px 16px;font-size:16px;font-weight:700;box-shadow:0 14px 34px var(--shadow);cursor:pointer;animation:fadeup .5s ease both;text-align:left}
.gq-banner span{margin-left:auto;background:rgba(255,255,255,.25);padding:6px 12px;border-radius:20px;font-size:14px}
.gq{padding-bottom:90px}
.gq-top{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700;margin:4px 0 12px}
.gq-q{font-family:var(--fd);font-size:25px;line-height:1.2;text-align:center;color:var(--ink);margin:0 0 16px;animation:fadeup .6s ease both}
.gq-ch{display:grid;gap:10px}
.gq-ch.two{grid-template-columns:1fr 1fr}
.gq-c{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:var(--rad);padding:14px;font-size:17px;line-height:1.2;cursor:pointer;transition:all .3s;box-shadow:0 6px 16px rgba(0,0,0,.06)}
.gq-ch.two .gq-c{flex-direction:column;justify-content:center;text-align:center;padding:22px 10px;font-family:var(--fs);font-size:24px}
.gq-c b{width:36px;height:36px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--onaccent);font-size:16px}
.gq-c.me{border-color:var(--accent);box-shadow:0 0 0 4px rgba(var(--glow),.35);transform:scale(1.02)}
.gq-c.ok{border-color:#3fbf6f;background:rgba(63,191,111,.12)}.gq-c.ok b{background:#3fbf6f;color:#fff}
.gq-c.ko{border-color:#e2574c;background:rgba(226,87,76,.10)}.gq-c.ko b{background:#e2574c;color:#fff}
.gq-c.no{opacity:.45}
.gq-c:disabled{cursor:default}
.gq-foot{text-align:center;margin-top:16px;font-size:16px;color:var(--muted);min-height:26px}
.gq-foot .tm{font-weight:800;font-size:26px;color:var(--accent);font-variant-numeric:tabular-nums}
.gq-foot .tm.low{color:#e2574c}
.gq-res{text-align:center;font-family:var(--fs);font-size:30px;color:var(--accent);margin-top:14px;animation:fadeup .5s ease both}
.gq-info{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:12px 14px;margin-top:10px;font-size:15px;color:var(--ink)}
.gq-score{text-align:center;font-size:14px;color:var(--muted);margin-top:14px}
.gq-rank{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:12px 14px;margin-bottom:8px;font-size:17px}
.gq-rank i{font-style:normal;font-weight:800;color:var(--accent);width:28px}
.gq-rank em{font-style:normal;margin-left:auto;font-weight:800;font-size:20px;color:var(--accent)}
.gq-team{display:grid;gap:8px;margin:6px 0 4px}
.gq-team button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:var(--rad);padding:14px;font-size:17px;cursor:pointer}
.gq-team button.solo{border-style:dashed}
.gq-me{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin:-4px 0 10px}
.gq-me button{background:none;border:0;color:var(--accent);font-size:13px;text-decoration:underline;cursor:pointer;padding:0}
.gq-win{text-align:center;font-family:var(--fs);font-size:30px;color:var(--accent);margin:4px 0 14px;animation:fadeup .6s ease both}
.reactbar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:40px;padding:8px 10px;box-shadow:0 12px 34px var(--shadow);z-index:60}
.reactbar button{border:0;background:transparent;font-size:28px;width:50px;height:50px;border-radius:50%;cursor:pointer;transition:transform .12s}
.reactbar button:active{transform:scale(1.35)}
.reactbar .lbl{position:absolute;left:50%;top:-24px;transform:translateX(-50%);font-size:12px;color:var(--muted);white-space:nowrap;font-weight:600}
.lfly{position:fixed;font-size:34px;pointer-events:none;z-index:70;animation:lfly 1.4s ease-out forwards}
@keyframes lfly{to{transform:translateY(-260px) scale(1.4);opacity:0}}
.confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:90;pointer-events:none;animation:conf linear forwards}
@keyframes conf{to{transform:translateY(105vh) rotate(720deg)}}

/* =========================== CONSOLE =========================== */
.console{max-width:1120px;margin:0 auto;padding:0 16px 60px}
.c-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:4px 0 14px}
.c-top h1{font-family:var(--fd);font-weight:500;font-size:34px;margin:4px 0 0;line-height:1}
.c-top h1 .amp{font-family:var(--fs);color:var(--accent)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#3a9a5b;background:rgba(58,154,91,.12);padding:4px 10px;border-radius:20px}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:#3a9a5b;animation:tw 1.6s infinite}
.c-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;position:sticky;top:0;z-index:10;padding:10px 0;background:var(--bg1);border-bottom:1px solid var(--line)}
.c-tabs .n{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:10px;background:#d9605a;color:#fff;font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.modes .btn{padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:14px}
.modes .btn .e{font-size:26px}
.modes .btn small{font-weight:400;opacity:.75;font-size:11px;text-transform:none;letter-spacing:0}
h3.sec{font-family:var(--fd);font-weight:600;font-size:23px;margin:0 0 12px}
.sub{color:var(--muted);font-size:13px;margin:-6px 0 12px}
.toggle{display:flex;align-items:center;gap:10px;margin:9px 0;cursor:pointer;font-size:14px}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tile .im{aspect-ratio:1;background:#ddd center/cover no-repeat}
.tile .meta{padding:8px 10px 4px;font-size:13px;color:var(--muted);min-height:34px}
.tile .meta b{color:var(--ink)}
.tile .act2{display:flex;gap:5px;padding:4px 8px 10px;flex-wrap:wrap}
.mlist{display:grid;gap:10px}
.mitem{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.mitem p{margin:0;font-family:var(--fs);font-size:24px;line-height:1.1}
.mitem small{color:var(--muted)}
.team{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 14px;margin-bottom:8px}
.team .sc{font-family:var(--fd);font-size:30px;min-width:50px;text-align:right}
.designs{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.designs button{border:2px solid var(--line);border-radius:16px;padding:0;overflow:hidden;cursor:pointer;background:var(--card);text-align:left;color:var(--ink)}
.designs button.on{border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--glow),.35)}
.designs .pv{height:96px;display:flex;align-items:center;justify-content:center;font-size:26px;position:relative;overflow:hidden}
.designs .tx{padding:10px 12px}
.designs .tx b{display:block;font-size:15px}
.designs .tx small{color:var(--muted);font-size:12px;line-height:1.35;display:block;margin-top:3px}
.palettes{display:flex;gap:10px;flex-wrap:wrap}
.palettes button{border:2px solid var(--line);border-radius:14px;padding:6px 12px 6px 6px;display:flex;align-items:center;gap:8px;cursor:pointer;background:var(--card);color:var(--ink);font-weight:600;font-size:13px}
.palettes button.on{border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--glow),.3)}
.palettes i{width:34px;height:34px;border-radius:10px;display:block;position:relative}
.palettes i::after{content:"";position:absolute;right:4px;bottom:4px;width:12px;height:12px;border-radius:50%;background:var(--dot)}
.stat{display:flex;gap:10px;flex-wrap:wrap}
.stat div{flex:1;min-width:90px;background:var(--card2);border-radius:14px;padding:10px 12px;text-align:center}
.stat b{display:block;font-family:var(--fd);font-size:30px;line-height:1}
.stat small{color:var(--muted);font-size:12px}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 10px}
.empty{color:var(--muted);font-style:italic;padding:6px 0}
.pin{max-width:360px;margin:10vh auto;text-align:center;padding:0 16px}
.pinwrap{position:relative}
.pinwrap .eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;font-size:22px;cursor:pointer;padding:6px}
.masked{-webkit-text-security:disc}
.linkbox{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.linkbox .q{background:#fff;padding:10px;border-radius:12px;line-height:0}
.linkbox code{word-break:break-all;font-size:13px;color:var(--accent)}
.steps{margin:0;padding-left:20px;line-height:1.8;color:var(--ink)}
</style>

/* PIN : un clavier AZERTY sans Maj tape &é"'(-è_çà au lieu de 1234567890 */
function normPin(v) {
  const map = { '&': '1', 'é': '2', '"': '3', "'": '4', '(': '5', '-': '6', 'è': '7', '_': '8', 'ç': '9', 'à': '0' };

}

/* ----- ornements d'en-tête selon le design ----- */
function garlandSVG() {
  const W = Math.max(320, Math.min(2600, innerWidth || 800)), H = 64, n = Math.max(2, Math.round(W / 430)), sag = 24, top = 4, per = 7;
  const cols = ['var(--accent2)', 'var(--accent)', '#ffd8a0'];
  let paths = '', bulbs = '', k = 0;
  for (let sw = 0; sw < n; sw++) {
    const x0 = sw * W / n, x1 = (sw + 1) * W / n, xm = (x0 + x1) / 2, yc = top + 2 * sag;
    paths += `M${x0},${top} Q${xm},${yc} ${x1},${top} `;
    for (let i = 1; i < per; i++) {
      const t = i / per, x = (1 - t) ** 2 * x0 + 2 * (1 - t) * t * xm + t * t * x1, y = (1 - t) ** 2 * top + 2 * (1 - t) * t * yc + t * t * top;
      bulbs += `<g class="bulb" style="animation-delay:${((k++) * 0.37 % 2.4).toFixed(2)}s"><line x1="${x}" y1="${y}" x2="${x}" y2="${y + 5}" stroke="var(--muted)" stroke-opacity=".55" stroke-width="1.4"/><circle cx="${x}" cy="${y + 11}" r="12" fill="rgba(var(--glow),.25)"/><circle cx="${x}" cy="${y + 11}" r="4.6" fill="${cols[k % 3]}"/></g>`;
    }
  }
  return `<svg class="garland" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMin meet" style="height:${H}px" aria-hidden="true"><path d="${paths}" fill="none" stroke="var(--muted)" stroke-opacity=".55" stroke-width="1.5"/>${bulbs}</svg>`;
}
function leavesSVG() {
  const W = Math.max(320, Math.min(1400, innerWidth || 800)), H = 64, cols = ['var(--accent)', 'var(--accent2)', 'var(--muted)'];
  let s = `<path d="M${W * .18},34 Q${W * .5},10 ${W * .82},34" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-opacity=".7"/>`;
  for (let i = 0; i <= 16; i++) {
    const t = i / 16, x = W * .18 + W * .64 * t, y = 34 - 24 * 4 * t * (1 - t) * .5 - 0, up = i % 2 ? -1 : 1;
    s += `<ellipse cx="${x}" cy="${y + up * 7}" rx="9" ry="4" fill="${cols[i % 3]}" fill-opacity=".85" transform="rotate(${up * 35} ${x} ${y + up * 7})"/>`;
  }
  return `<svg class="garland" viewBox="0 0 ${W} ${H}" style="height:${H}px" aria-hidden="true">${s}</svg>`;
}
function confettiSVG() {
  const W = Math.max(320, Math.min(1400, innerWidth || 800)), H = 64, cols = ['var(--accent)', 'var(--accent2)', '#ffd23f', '#7ce07c', '#3fd6ff', '#ff8a5c'];
  let s = '';
  for (let i = 0; i < 46; i++) {
    const x = (i * 97) % W, y = 8 + (i * 37) % 48, c = cols[i % cols.length];
    s += i % 3 ? `<rect x="${x}" y="${y}" width="10" height="5" rx="1.5" fill="${c}" transform="rotate(${(i * 47) % 180} ${x} ${y})"/>` : `<circle cx="${x}" cy="${y}" r="4" fill="${c}"/>`;
  }
  return `<svg class="garland" viewBox="0 0 ${W} ${H}" style="height:${H}px" aria-hidden="true">${s}</svg>`;
}
function headerDeco() {
  const d = design();
  if (d.deco === 'prestige') return `<div class="deco deco-prestige"><span></span><b>◆</b><span></span></div>`;
  if (d.deco === 'leaves') return leavesSVG();
  if (d.deco === 'confetti') return confettiSVG();
  if (d.deco === 'disco') return `<div class="deco"><span class="deco-disco">🪩</span></div>`;
  return garlandSVG();
}

/* Compression photo : image (≈1600 px) + vignette (≈360 px) */
async function compressImage(file) {
  let bmp;
  try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch (e) { bmp = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); }); }
  const w0 = bmp.width, h0 = bmp.height;
  const draw = (maxSide, q) => {
    const sc = Math.min(1, maxSide / Math.max(w0, h0)), c = document.createElement('canvas');
    c.width = Math.round(w0 * sc); c.height = Math.round(h0 * sc);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', q);
  };
  let side = DEMO ? 900 : 1600, q = DEMO ? 0.68 : 0.82, data = '';
  for (let i = 0; i < 6; i++) { data = draw(side, q); if (data.length < (DEMO ? 220000 : 850000)) break; side *= 0.82; q = Math.max(0.5, q - 0.06); }
  return { data, thumb: draw(DEMO ? 260 : 360, 0.7), ratio: w0 / h0 };
}

        .g{display:grid;grid-template-columns:1fr 1fr;gap:8mm}.c{border:1.5px solid ${v.accent};border-radius:${dk2r()};padding:7mm;text-align:center;height:132mm;display:flex;flex-direction:column;justify-content:center;align-items:center;page-break-inside:avoid;background:#fffdf8}
        .k{font-size:8pt;letter-spacing:.25em;text-transform:uppercase;color:${v.accent}}.n{font-family:${d.fonts.d};font-size:26pt;margin:2mm 0 4mm}.amp{font-family:${d.fonts.s};color:${v.accent}}
        img{width:56mm;height:56mm}.t{font-family:${d.fonts.s};font-size:22pt;color:${v.accent};margin-top:3mm}.dd{font-size:10pt;line-height:1.5;color:#7a6a5c}
        </style></head><body><div class="g">${card.repeat(4)}</div><script>setTimeout(()=>print(),1000)<\/script></body></html>`);
      w.document.close();
    };
    function dk2r() { return { prestige: '0', pop: '10mm', boheme: '8mm', disco: '4mm' }[designKey()] || '6mm'; }
  }

  render();
  startSync(['settings', 'photos', 'messages', 'teams', 'reactions'], () => {
    const ae = document.activeElement;
    if (ae && ['INPUT', 'TEXTAREA'].includes(ae.tagName) && !['checkbox', 'range', 'color'].includes(ae.type)) return;
    const y = scrollY; render(); scrollTo(0, y);
  });
}
